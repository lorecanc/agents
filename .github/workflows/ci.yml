name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ENGINE_REPOSITORY: lorecanc/manage-agents

jobs:
  catalog:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the catalog
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: catalog
      - name: Check out the engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          path: engine
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: npm ci
        working-directory: catalog
      - run: npm ci
        working-directory: engine
      - name: Catalog tests (merged pack tree, bench, scripts)
        run: npm test
        working-directory: catalog
      - name: Pipeline shell rules match scripts/bash-profiles.json
        run: npm run check
        working-directory: catalog
      - name: Every pack satisfies the contract
        run: node engine/manage-agents.mjs pack validate --git catalog/packs/*/
      - name: Cross-pack dependency closure resolves cleanly
        run: |
          mkdir -p xdg
          XDG_CONFIG_HOME="$PWD/xdg" node engine/manage-agents.mjs source add catalog catalog
          XDG_CONFIG_HOME="$PWD/xdg" node engine/manage-agents.mjs resolve flow pipeline docs slides wiki general
      - name: Committed bridges match a fresh regeneration
        run: node engine/manage-agents.mjs bridge check --workspace catalog
