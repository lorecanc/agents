name: Publish category
on:
  workflow_dispatch:
    inputs:
      category:
        required: true
        type: choice
        options: [wiki, docs, slides]
      dry_run:
        required: true
        type: boolean
        default: true
      artifact_only:
        required: true
        type: boolean
        default: false
      bootstrap:
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4.1.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26 }
      - run: npm ci
        working-directory: manage-agents
      - run: npm run validate
        working-directory: manage-agents
      - run: node manage-agents.mjs --no-auto-commit category check "${{ inputs.category }}"
        working-directory: manage-agents
      - run: node manage-agents.mjs --no-auto-commit category package "$CATEGORY" --output .agent-manager/category-artifacts --source-sha "${{ github.sha }}"
        working-directory: manage-agents
        env:
          CATEGORY: ${{ inputs.category }}
          AGENT_MANAGER_SOURCE_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: category-package-${{ inputs.category }}
          path: manage-agents/.agent-manager/category-artifacts
          if-no-files-found: error
  publication:
    needs: validate
    if: ${{ !inputs.dry_run && !inputs.artifact_only }}
    environment: category-publication
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956748 # v4.1.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26 }
      - run: npm ci
        working-directory: manage-agents
      - run: npm run build
        working-directory: manage-agents
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: category-package-${{ inputs.category }}
          path: manage-agents/.agent-manager/category-artifacts
      - run: |
          test -n "$CATEGORY_PUBLISH_TOKEN" || { echo 'Configure CATEGORY_PUBLISH_TOKEN in category-publication.'; exit 1; }
        env:
          CATEGORY_PUBLISH_TOKEN: ${{ secrets.CATEGORY_PUBLISH_TOKEN }}
      - run: node manage-agents.mjs --no-auto-commit category publish "${{ inputs.category }}" --package manage-agents/.agent-manager/category-artifacts --source-sha "${{ github.sha }}" --confirm-remote $BOOTSTRAP
        env:
          CATEGORY: ${{ inputs.category }}
          GITHUB_SHA: ${{ github.sha }}
          BOOTSTRAP: ${{ inputs.bootstrap && '--bootstrap' || '' }}
          CATEGORY_PUBLISH_TOKEN: ${{ secrets.CATEGORY_PUBLISH_TOKEN }}
